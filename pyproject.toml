[build-system]
requires = [
    "hatchling>=1.18",
]
build-backend = "hatchling.build"

[project]
name = "routedel"
version = "1.0.2"
description = "Delete, add, list and monitor IPv4 routes, with ntfy and Growl (GNTP) notifications to multiple servers."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Hadi Cahyadi", email = "cumulus13@gmail.com" },
]
keywords = [
    "route",
    "routing",
    "network",
    "cli",
    "ntfy",
    "growl",
    "gntp",
    "monitor",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
]
dependencies = [
    "rich>=13.0",
    "rchf",
    "richcolorlog",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
clipboard = [
    "clipboard",
]
dev = [
    "pytest",
    "build",
    "twine",
]

[project.scripts]
routedel = "routedel.cli:main"

[project.urls]
Homepage = "https://github.com/cumulus13/routedel"
Issues = "https://github.com/cumulus13/routedel/issues"

[tool.hatch.build.targets.wheel]
packages = [
    "src/routedel",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
